[project]
name = "db"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "dotenv>=0.9.9",
    "oracledb>=4.0.2",
    "psycopg[binary]>=3.3.4",
    "pymysql>=1.2.0",
    "pyodbc>=5.3.0",
    "sqlmodel>=0.0.39",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["db"]
