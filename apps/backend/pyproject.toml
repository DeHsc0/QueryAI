[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "clerk-backend-api>=6.0.1",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.138.2",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.5.2",
    "langchain-qdrant>=1.1.0",
    "langgraph-checkpoint-redis>=0.5.1",
    "langsmith>=0.11.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "redis>=7.4.1",
    "sqlmodel>=0.0.39",
    "svix>=1.96.1",
    "uvicorn>=0.49.0",
    "task_queue",
    "db",
    "sqlglot>=30.18.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.uv.sources]
db = { workspace = true }
task_queue = { workspace = true }
